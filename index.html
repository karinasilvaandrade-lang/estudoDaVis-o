<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Como os Cachorros Enxergam o Mundo</title>
    <style>
        /* 1. VARIÁVEIS NORMAIS */
        :root {
            --primary-color: #2b5c8f;
            --primary-light: #eaf2fb;
            --text-dark: #1e293b;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --base-font-size: 100%;
        }

        /* 2. REGRAS DO ALTO CONTRASTE */
        body.high-contrast {
            --primary-color: #ffff00 !important;
            --primary-light: #000000 !important;
            --text-dark: #ffffff !important;
            --bg-light: #000000 !important;
            --card-bg: #000000 !important;
            --border-color: #ffffff !important;
        }

        html {
            font-size: var(--base-font-size);
        }

        body {
            font-family: system-ui, sans-serif;
            font-size: 1rem; /* Permite redimensionar com os botões A+ / A- */
            background-color: var(--bg-light);
            color: var(--text-dark);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Estilo dos Botões */
        .accessibility-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .accessibility-bar button {
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            background: var(--card-bg);
            color: var(--text-dark);
            border: 2px solid var(--border-color);
            border-radius: 6px;
        }

        /* Ajuste do Header no Alto Contraste */
        header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        body.high-contrast header {
            background: #000000;
            border: 2px solid #ffffff;
            color: #ffffff;
        }

        section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRA DE BOTOES -->
        <div class="accessibility-bar">
            <button id="btn-contrast">Alto Contraste 🌓</button>
            <button id="btn-decrease">A-</button>
            <button id="btn-increase">A+</button>
        </div>

        <header>
            <h1>🐶 Como os Cachorros Enxergam o Mundo</h1>
            <p>Os cachorros enxergam o mundo de um jeito bem diferente do nosso!</p>
        </header>

        <section>
            <h2>🎨 A Visão das Cores</h2>
            <p>Enquanto os humanos veem três cores primárias, os cães veem apenas tons de azul e amarelo.</p>
        </section>
    </div>

    <!-- JAVASCRIPT DIRETO NO HTML -->
    <script>
        const btnContrast = document.getElementById('btn-contrast');
        const btnIncrease = document.getElementById('btn-increase');
        const btnDecrease = document.getElementById('btn-decrease');

        let fontSize = 100;

        // Função de Alto Contraste
        btnContrast.onclick = function() {
            document.body.classList.toggle('high-contrast');
        };

        // Função Aumentar Fonte
        btnIncrease.onclick = function() {
            if (fontSize < 150) {
                fontSize += 10;
                document.documentElement.style.setProperty('--base-font-size', fontSize + '%');
            }
        };

        // Função Diminuir Fonte
        btnDecrease.onclick = function() {
            if (fontSize > 80) {
                fontSize -= 10;
                document.documentElement.style.setProperty('--base-font-size', fontSize + '%');
            }
        };
    </script>
</body>
</html>
